<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>資產淨值</title>
<script>
  document.write('<link rel="stylesheet" href="holdings-editor.css?v=' + Date.now() + '">');
  document.write('<link rel="stylesheet" href="networth.css?v=' + Date.now() + '">');
  document.write('<link rel="stylesheet" href="theme.css?v=' + Date.now() + '">');
</script>
</head>
<body>
      <div class="sheet-wrap nw-wrap">
        <div class="sheet-header">
          <h1>資產淨值</h1>
        </div>
        <div class="sheet-note">資料每月由阿紘在 Google Sheet 更新後手動同步，唯讀。</div>

        <div class="nw-chart-section">
          <div class="nw-chart-title">總資產走勢（每月）</div>
          <div class="nw-chart-wrap" id="nwChartWrap">
            <div id="nwChart"></div>
            <div class="nw-chart-tooltip" id="nwChartTooltip"></div>
          </div>
          <div class="nw-legend" id="nwLegend"></div>
        </div>

        <div class="table-scroll">
          <table class="sheet-table">
            <thead>
              <tr>
                <th>日期</th>
                <th>美股總現值</th>
                <th>美股現金部位</th>
                <th>總本金</th>
                <th>美股總資產</th>
                <th>報酬率</th>
                <th>YOY</th>
                <th>MOM</th>
                <th>現金水位</th>
                <th>國泰現金</th>
                <th>中信現金</th>
                <th>玉山現金</th>
                <th>玉山期貨</th>
                <th>加密貨幣</th>
                <th>期貨+台幣+加密</th>
                <th>總資產</th>
                <th>總資產淨增減</th>
                <th>總資產MOM</th>
              </tr>
            </thead>
            <tbody id="nwBody"></tbody>
          </table>
        </div>

        <div class="sheet-footer" id="sheetFooter"></div>
      </div>

  <script>
    // 資料檔跟主程式加上當下時間戳，確保每次打開都抓到排程任務推上去的最新版本。
    // 用 async=false 的動態 script：同時並行下載，但仍依序執行（主程式最後跑）。
    (function () {
      var v = Date.now();
      ["networth_data.js", "networth.js"].forEach(function (src) {
        var s = document.createElement("script");
        s.src = src + "?v=" + v;
        s.async = false;
        document.body.appendChild(s);
      });
    })();
  </script>
</body>
</html>
