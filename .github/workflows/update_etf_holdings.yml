name: Update ETF Holdings

on:
  schedule:
    # 台灣時間早上 6:00（UTC 前一日 22:00），每天一次即可（成分股組成不常變動）
    - cron: '0 22 * * *'
  workflow_dispatch:  # 允許手動觸發

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Fetch ETF holdings
        run: python scripts/fetch_etf_holdings.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/etf_holdings.json
          git diff --staged --quiet || git commit -m "chore: auto-update ETF holdings $(date -u +%Y-%m-%d)"
          git push
