name: Option Prices

on:
  schedule:
    # 美股收盤後（UTC 22:30，冬夏令都已收盤），週一到週五
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

concurrency:
  group: option-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Fetch option prices
        run: python scripts/fetch_option_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/option_prices.json
          git diff --staged --quiet || git commit -m "chore: option prices $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 5; done
