name: Update Institutional Data

on:
  schedule:
    # 台灣時間下午 5:30（UTC 09:30），週一到週五
    - cron: '30 9 * * 1-5'
  workflow_dispatch:  # 允許手動觸發

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests urllib3 pandas lxml html5lib

      - name: Fetch TWSE institutional data
        run: python scripts/fetch_institutional.py

      - name: 抓取期貨法人籌碼
        run: python scripts/fetch_futures_institutional.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/institutional_latest.json data/futures_institutional_latest.json
          git diff --staged --quiet || git commit -m "chore: auto-update institutional data $(date -u +%Y-%m-%d)"
          git push